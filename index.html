<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5c400" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Flappy Bird — The bird of flap.sh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <h1>Flappy Bird</h1>
      <p class="tag">The bird of <span>flap.sh</span></p>
    </div>
    <nav class="actions">
      <a class="btn btn-x" href="https://x.com/Flappy_birdflap" target="_blank" rel="noopener noreferrer" aria-label="Follow on X">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        <span>X</span>
      </a>
      <a class="btn btn-buy" href="https://pancakeswap.finance/" target="_blank" rel="noopener noreferrer">Buy Here</a>
    </nav>
  </header>

  <section class="ca-bar" aria-label="Contract address">
    <span class="ca-label">CA</span>
    <code id="ca" class="ca-addr">0x0000000000000000000000000000000000000000</code>
    <button type="button" id="copy-ca" class="btn-copy" aria-label="Copy contract address">Copy</button>
  </section>

  <main class="game-wrap">
    <canvas id="game" width="400" height="600" role="img" aria-label="Flappy Bird game. Tap or press space to flap."></canvas>
    <p class="hint" id="hint">Tap to flap</p>
  </main>

  <footer class="foot">
    <p>flap.sh · tap · dodge pipes · stack bags</p>
  </footer>

  <script src="game.js"></script>
</body>
</html>
